<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content">
<title>パレ学1期生クロスワード</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif;
  background: #f5f5f5;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 16px;
  min-height: 100vh;
}

h1 {
  font-size: 1.4rem;
  margin-bottom: 8px;
  color: #333;
}

#info {
  font-size: 0.9rem;
  color: #666;
  margin-bottom: 12px;
}

#grid-container {
  max-width: 95vw;
  overflow-x: auto;
  border: 2px solid #333;
}

#grid {
  border-collapse: collapse;
  background: #333;
  border-spacing: 1px;
}

#grid td {
  width: 34px;
  height: 34px;
  min-width: 34px;
  min-height: 34px;
  max-width: 34px;
  max-height: 34px;
  position: relative;
  padding: 0;
  text-align: center;
  vertical-align: middle;
}

td.b {
  background: #333;
}

td.w {
  background: #fff;
  border: 1px solid #aaa;
  cursor: pointer;
}

td.w.sel {
  background: #bbdefb;
}

td.w.hl {
  background: #e3f2fd;
}

td.w.ok {
  background: #c8e6c9;
}

.n {
  position: absolute;
  top: 1px;
  left: 2px;
  font-size: 10px;
  color: #d32f2f;
  font-weight: bold;
  pointer-events: none;
  line-height: 1;
}

td.w.fa-cell {
  background: #fff8e1;
}

td.w.fa-cell.sel {
  background: #bbdefb;
}

td.w.fa-cell.hl {
  background: #e3f2fd;
}

td.w.fa-cell.ok {
  background: #c8e6c9;
}

#final-answer {
  margin-top: 20px;
  text-align: center;
  max-width: 700px;
  width: 100%;
}

#final-answer h2 {
  font-size: 1.1rem;
  margin-bottom: 10px;
  color: #333;
}

#fa-cells {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 4px;
  margin-bottom: 10px;
}

.fa-box {
  width: 38px;
  height: 38px;
  border: 2px solid #d32f2f;
  border-radius: 4px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  color: #111;
  background: #fff;
  position: relative;
}

.fa-box .fa-num {
  position: absolute;
  top: 1px;
  left: 3px;
  font-size: 9px;
  color: #d32f2f;
  font-weight: bold;
}

#fa-result {
  font-size: 1rem;
  min-height: 1.5em;
}

#fa-result.ok {
  color: #2e7d32;
  font-weight: bold;
  font-size: 1.2rem;
}

#fa-result.ng {
  color: #d32f2f;
  font-weight: bold;
}

.c {
  display: block;
  width: 100%;
  height: 100%;
  line-height: 34px;
  font-size: 17px;
  color: #111;
  pointer-events: none;
}

.c.hint {
  color: #1565c0;
  font-weight: bold;
}

.c.answer {
  background: #fff9c4;
}

.c.vertical-bar {
  transform: rotate(90deg);
}

#controls {
  margin-top: 12px;
  display: flex;
  gap: 12px;
  align-items: center;
}

button {
  padding: 8px 20px;
  font-size: 0.9rem;
  border: 1px solid #999;
  border-radius: 4px;
  background: #fff;
  cursor: pointer;
}

button:hover { background: #eee; }

#msg {
  margin-top: 12px;
  font-size: 1rem;
  color: #333;
  min-height: 1.5em;
}

#msg.ok {
  color: #2e7d32;
  font-weight: bold;
  font-size: 1.2rem;
}

#popup-overlay {
  display: none;
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  z-index: 99;
}

.floating-popup {
  display: none;
  position: absolute;
  z-index: 100;
  background: #fff;
  border-radius: 8px;
  box-shadow: 0 4px 16px rgba(0,0,0,0.25);
  padding: 12px;
}

#dir-popup {
  display: none;
  flex-direction: column;
  gap: 6px;
  min-width: 140px;
}

#dir-popup .dir-choice {
  font-size: 1.1rem;
  padding: 10px 20px;
  cursor: pointer;
  border-radius: 6px;
  text-align: center;
}

#dir-popup .dir-choice:hover {
  background: #e3f2fd;
}

#word-popup {
  flex-direction: column;
  padding: 10px 14px;
  width: 200px;
  box-sizing: border-box;
}

.floating-popup.mobile-bottom {
  position: fixed !important;
  bottom: 0 !important;
  left: 0 !important;
  right: 0 !important;
  top: auto !important;
  width: 100% !important;
  max-width: 100% !important;
  border-radius: 12px 12px 0 0 !important;
  box-sizing: border-box !important;
}

#word-popup-label {
  font-size: 1.1rem;
  font-weight: bold;
  color: #1565c0;
  margin-bottom: 6px;
  text-align: center;
}

#word-input {
  font-size: 1.1rem;
  padding: 6px 8px;
  width: 100%;
  border: 2px solid #1565c0;
  border-radius: 6px;
  ime-mode: active;
  outline: none;
  text-align: center;
  letter-spacing: 0.1em;
}

#word-input:focus {
  border-color: #0d47a1;
  box-shadow: 0 0 0 2px rgba(21,101,192,0.15);
}

#word-error {
  color: #d32f2f;
  font-size: 0.8rem;
  min-height: 1em;
  margin-top: 3px;
  text-align: center;
}

.word-popup-buttons {
  display: flex;
  gap: 6px;
  margin-top: 8px;
}

.word-popup-buttons button {
  flex: 1;
  padding: 6px 0;
  font-size: 0.85rem;
  border-radius: 6px;
}

#word-ok {
  background: #1565c0;
  color: #fff;
  border: 1px solid #1565c0;
}

#word-ok:hover {
  background: #0d47a1;
}

#word-cancel {
  background: #f5f5f5;
  color: #333;
}
</style>
</head>
<body>

<h1>パレ学1期生クロスワード</h1>

<div id="grid-container">

</div>
<div id="controls">
  <button id="btn-reset">リセット</button>
  <button id="btn-answer">答えを見る</button>
</div>
<div id="msg"></div>
<div id="final-answer" style="display:none;">

  <div id="fa-result"></div>

<div id="popup-overlay"></div>
<div id="dir-popup" class="floating-popup">

const W = P.size.width;

const userCells = {};

const CIRCLE_NUMS = '①②③④⑤⑥⑦⑧⑨⑩⑪⑫⑬⑭⑮⑯⑰⑱⑲⑳';

    if (G[y][x] === null) continue;
    const m = G[y][x].match(/^(.+?)(\d+)$/);
    if (m) {
      G[y][x] = m[1]; // pure character
      const order = parseInt(m[2]);
      answerMap[x + ',' + y] = order;
      answerCells.push({order, x, y});
    }
  }
}
answerCells.sort((a, b) => a.order - b.order);

// Init hints

  const k = h.x + ',' + h.y;
  hintSet.add(k);
  userCells[k] = h.char;

const downCells = new Set();

  const dy = w.direction === 'down' ? 1 : 0;

    const k = (w.x + dx * i) + ',' + (w.y + dy * i);
    if (w.direction === 'down') downCells.add(k);

function render() {
  const t = document.getElementById('grid');

  for (let y = 0; y < H; y++) {
    const tr = document.createElement('tr');
    for (let x = 0; x < W; x++) {
      const td = document.createElement('td');
      if (G[y][x] === null) {
        td.className = 'b';
      } else {
        td.className = 'w';
        td.dataset.x = x;
        td.dataset.y = y;
        const k = x + ',' + y;
        if (k in answerMap) {
          td.classList.add('fa-cell');
          const s = document.createElement('span');
          s.className = 'n';
          s.textContent = CIRCLE_NUMS[answerMap[k] - 1] || answerMap[k];

        c.className = 'c';

          if (hintSet.has(k)) c.classList.add('hint');
          if (userCells[k] === 'ー' && downCells.has(k) && !acrossCells.has(k)) c.classList.add('vertical-bar');

        td.appendChild(c);
      }
      tr.appendChild(td);
    }
    t.appendChild(tr);

function hilite() {
  document.querySelectorAll('td.w').forEach(td => {
    td.classList.remove('sel', 'hl');
  });
  if (!sel) return;
  const word = wordAt(sel.x, sel.y, dir);
  if (word) {
    const dx = word.direction === 'across' ? 1 : 0;
    const dy = word.direction === 'down' ? 1 : 0;
    for (let i = 0; i < word.length; i++) {
      const td = getCell(word.x + dx * i, word.y + dy * i);
      if (td) td.classList.add('hl');
    }
  }
  const s = getCell(sel.x, sel.y);
  if (s) s.classList.add('sel');
}

function getCell(x, y) {
  return document.querySelector('td[data-x="' + x + '"][data-y="' + y + '"]');
}

function wordAt(x, y, d) {
  for (const w of P.words) {
    if (w.direction !== d) continue;
    const dx = d === 'across' ? 1 : 0;
    const dy = d === 'down' ? 1 : 0;
    for (let i = 0; i < w.length; i++) {
      if (w.x + dx * i === x && w.y + dy * i === y) return w;
    }
  }
  return null;
}

function select(x, y) {
  if (x < 0 || x >= W || y < 0 || y >= H || G[y][x] === null) return;
  sel = { x, y };
  hilite();
}

    if (hintSet.has(k)) c.classList.add('hint');
    if (ch === 'ー' && downCells.has(k) && !acrossCells.has(k)) c.classList.add('vertical-bar');
  }
  renderFinalAnswer();
}

function wordsAtCell(x, y) {
  return P.words.filter(w => {
    const dx = w.direction === 'across' ? 1 : 0;
    const dy = w.direction === 'down' ? 1 : 0;
    for (let i = 0; i < w.length; i++) {
      if (w.x + dx * i === x && w.y + dy * i === y) return true;
    }
    return false;
  });
}

function getWordCurrentText(w) {
  const dx = w.direction === 'across' ? 1 : 0;
  const dy = w.direction === 'down' ? 1 : 0;
  let text = '';
  for (let i = 0; i < w.length; i++) {
    const k = (w.x + dx * i) + ',' + (w.y + dy * i);
    text += (k in userCells) ? userCells[k] : '';
  }
  return text;
}

function isMobile() {
  var vw = (window.visualViewport ? window.visualViewport.width : window.innerWidth);
  return vw <= 768;
}

function positionPopup(popup, cellTd, side) {
  popup.style.display = 'flex';
  if (isMobile()) {
    popup.classList.add('mobile-bottom');
    return;
  }
  popup.classList.remove('mobile-bottom');
  const rect = cellTd.getBoundingClientRect();
  const pw = popup.offsetWidth;
  const ph = popup.offsetHeight;
  let top, left;
  if (side === 'right') {
    top = rect.top + window.scrollY;
    left = rect.right + window.scrollX + 4;
    if (left + pw > window.innerWidth - 8) left = rect.left + window.scrollX - pw - 4;
    if (top + ph > window.innerHeight + window.scrollY - 8) top = window.innerHeight + window.scrollY - ph - 8;
  } else {
    top = rect.bottom + window.scrollY + 4;
    left = rect.left + window.scrollX;
    if (top + ph > window.innerHeight + window.scrollY - 8) top = rect.top + window.scrollY - ph - 4;
  }
  if (left + pw > window.innerWidth - 8) left = window.innerWidth - pw - 8;
  if (left < 8) left = 8;
  if (top < window.scrollY + 8) top = window.scrollY + 8;
  popup.style.left = left + 'px';
  popup.style.top = top + 'px';
}

function showOverlay() {
  document.getElementById('popup-overlay').style.display = 'block';
}

function resetPopupStyle(p) {
  p.classList.remove('mobile-bottom');
  p.style.left = ''; p.style.top = ''; p.style.bottom = '';
}

function hideAllPopups() {
  document.getElementById('popup-overlay').style.display = 'none';
  const dirPopup = document.getElementById('dir-popup');
  const wordPopup = document.getElementById('word-popup');
  dirPopup.style.display = 'none';
  wordPopup.style.display = 'none';
  resetPopupStyle(dirPopup);
  resetPopupStyle(wordPopup);
  document.getElementById('word-error').textContent = '';
}

let currentPopupWord = null;

function showDirPopup(x, y, cellTd) {
  hideAllPopups();
  showOverlay();
  const popup = document.getElementById('dir-popup');
  popup.dataset.cellX = x;
  popup.dataset.cellY = y;
  positionPopup(popup, cellTd);
}

function showWordPopup(word, cellTd) {
  const dirPopup = document.getElementById('dir-popup');
  dirPopup.style.display = 'none';
  currentPopupWord = word;
  dir = word.direction;
  sel = { x: word.x, y: word.y };
  hilite();
  showOverlay();
  const popup = document.getElementById('word-popup');
  const dirLabel = word.direction === 'across' ? 'よこ' : 'たて';
  document.getElementById('word-popup-label').textContent =
    dirLabel + ' ' + word.length + '文字';
  const input = document.getElementById('word-input');
  input.value = getWordCurrentText(word);
  document.getElementById('word-error').textContent = '';
  const side = word.direction === 'down' ? 'right' : 'below';
  positionPopup(popup, cellTd, side);
  setTimeout(() => { input.focus(); input.select(); }, 50);
}

function handleWordSubmit() {
  if (!currentPopupWord) return;
  const input = document.getElementById('word-input');
  const text = input.value;
  const chars = [...text];
  const w = currentPopupWord;
  const dx = w.direction === 'across' ? 1 : 0;
  const dy = w.direction === 'down' ? 1 : 0;
  if (chars.length === 0) {
    for (let i = 0; i < w.length; i++) {
      setChar(w.x + dx * i, w.y + dy * i, null);
    }
  } else if (chars.length !== w.length) {
    document.getElementById('word-error').textContent =
      chars.length + '文字入力されています（' + w.length + '文字必要）';
    return;
  } else {
    for (let i = 0; i < w.length; i++) {
      setChar(w.x + dx * i, w.y + dy * i, chars[i]);
    }
  }
  hideAllPopups();
  checkComplete();
}

// Reset
document.getElementById('btn-reset').addEventListener('click', () => {
  hideAllPopups();
  if (!confirm('入力をすべてリセットしますか？')) return;
  for (const k in userCells) { if (!hintSet.has(k)) delete userCells[k]; }
  sel = null;
  document.getElementById('msg').textContent = '';
  document.getElementById('msg').className = '';
  render();
  renderFinalAnswer();
});

// Answer
document.getElementById('btn-answer').addEventListener('click', () => {
  hideAllPopups();
  if (!confirm('答えを表示しますか？')) return;
  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      if (G[y][x] === null) continue;
      const k = x + ',' + y;
      if (!(k in userCells) || userCells[k] !== G[y][x]) {
        userCells[k] = G[y][x];
      }
    }
  }
  render();
  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      if (G[y][x] === null) continue;
      const k = x + ',' + y;
      if (!hintSet.has(k)) {
        const td = getCell(x, y);
        if (td) { const c = td.querySelector('.c'); if (c) c.classList.add('answer'); }
      }
    }
  }
  renderFinalAnswer();
});

// Grid click → popup flow
document.getElementById('grid').addEventListener('click', (e) => {
  const td = e.target.closest('td.w');
  if (!td) return;
  const x = parseInt(td.dataset.x);
  const y = parseInt(td.dataset.y);
  const words = wordsAtCell(x, y);
  if (words.length === 0) return;
  if (words.length === 1) {
    select(x, y);
    showWordPopup(words[0], td);
  } else {
    select(x, y);
    showDirPopup(x, y, td);
  }
});

// Direction choice
document.querySelectorAll('.dir-choice').forEach(btn => {
  btn.addEventListener('click', () => {
    const popup = document.getElementById('dir-popup');
    const x = parseInt(popup.dataset.cellX);
    const y = parseInt(popup.dataset.cellY);
    const d = btn.dataset.dir;
    const word = wordAt(x, y, d);
    if (word) {
      const cellTd = getCell(x, y);
      showWordPopup(word, cellTd);
    }
  });
});

// Word popup OK
document.getElementById('word-ok').addEventListener('click', handleWordSubmit);

// Word popup Cancel
document.getElementById('word-cancel').addEventListener('click', hideAllPopups);

// Overlay click
document.getElementById('popup-overlay').addEventListener('click', hideAllPopups);

// Keyboard in word input
document.getElementById('word-input').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.isComposing) {
    e.preventDefault();
    handleWordSubmit();
  }
  if (e.key === 'Escape') {
    e.preventDefault();
    hideAllPopups();
  }
});

// Escape key global
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') hideAllPopups();
});

function checkComplete() {
  let allFilled = true;
  let allCorrect = true;
  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      if (G[y][x] === null) continue;
      const k = x + ',' + y;
      if (!(k in userCells)) { allFilled = false; break; }
      if (userCells[k] !== G[y][x]) allCorrect = false;
    }
    if (!allFilled) break;
  }
  const msg = document.getElementById('msg');
  if (allFilled && allCorrect) {
    msg.textContent = 'すべて正解です！';
    msg.className = 'ok';
    document.querySelectorAll('td.w').forEach(td => td.classList.add('ok'));
  } else {
    msg.textContent = '';
    msg.className = '';
  }
}

// Final answer
function renderFinalAnswer() {
  const container = document.getElementById('fa-cells');
  container.innerHTML = '';
  for (const ac of answerCells) {
    const box = document.createElement('div');
    box.className = 'fa-box';
    const num = document.createElement('span');
    num.className = 'fa-num';
    num.textContent = CIRCLE_NUMS[ac.order - 1] || ac.order;
    box.appendChild(num);
    const k = ac.x + ',' + ac.y;
    if (k in userCells) {
      const txt = document.createTextNode(userCells[k]);
      box.appendChild(txt);
    }
    container.appendChild(box);
  }
}

if (answerCells.length > 0) {
  document.getElementById('final-answer').style.display = '';
  document.getElementById('btn-fa-check').addEventListener('click', () => {
    const result = document.getElementById('fa-result');
    let allFilled = true;
    let allCorrect = true;
    for (const ac of answerCells) {
      const k = ac.x + ',' + ac.y;
      if (!(k in userCells)) { allFilled = false; break; }
      if (userCells[k] !== G[ac.y][ac.x]) allCorrect = false;
    }
    if (!allFilled) {
      result.className = '';
      result.textContent = 'まだ空いているマスがあります';
    } else if (allCorrect) {
      result.className = 'ok';
      const answer = answerCells.map(ac => userCells[ac.x + ',' + ac.y]).join('');
      result.textContent = '\ud83c\udf89 正解！「' + answer + '」';
    } else {
      result.className = 'ng';
      result.textContent = '不正解です…もう一度考えてみましょう';
    }
  });
}

render();
renderFinalAnswer();

// Keyboard handler: push popup above IME on iOS Safari etc.
function setupKeyboardHandler() {
  if (!window.visualViewport) return;
  function onViewportChange() {
    var popup = document.querySelector('.mobile-bottom');
    if (!popup) return;
    var keyboardHeight = window.innerHeight - window.visualViewport.height;
    if (keyboardHeight > 50) {
      popup.style.bottom = keyboardHeight + 'px';
    } else {
      popup.style.bottom = '0';
    }
  }
  window.visualViewport.addEventListener('resize', onViewportChange);
  window.visualViewport.addEventListener('scroll', onViewportChange);
}
setupKeyboardHandler();

// Hide answer button on non-local environments
const isLocal = location.protocol === 'file:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1';
if (!isLocal) {
  document.getElementById('btn-answer').style.display = 'none';
}
</script>
